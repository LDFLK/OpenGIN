# Expected violation: relationshipDefs[1].name (duplicate "located_in"; add the pair to
# relationshipDefs[0].endpoints instead).
kindDefs:
  - major: region
    minors: [country, district]
  - major: Organization
    minors: [Government, Department]
relationshipDefs:
  - name: located_in
    endpoints:
      - { from: Organization/Department, to: region/district }
  - name: located_in
    endpoints:
      - { from: Organization/Government, to: region/country }
