# Expected violation: relationshipDefs[1].name ("IS_ATTRIBUTE" is reserved for system attribute edges).
kindDefs:
  - major: region
    minors: [country, province]
relationshipDefs:
  - name: has_province
    endpoints:
      - { from: region/country, to: region/province }
  - name: IS_ATTRIBUTE
    endpoints:
      - { from: region/country, to: region/province }
