name: Ingestion API Test

on:
  push:
    branches: [ main ]
    paths:
      - 'opengin/ingestion-api/**'
      - 'opengin/ingestion-api/docker/Dockerfile'
      - 'opengin/ingestion-api/docker/Dockerfile.choreo'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'opengin/ingestion-api/**'
      - 'opengin/ingestion-api/docker/Dockerfile'
      - 'opengin/ingestion-api/docker/Dockerfile.choreo'
      - 'docker-compose.yml'

jobs:
  ingestion-api-workflow:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v3

    - name: Clear GitHub Actions cache
      run: |
        echo "🧹 Clearing GitHub Actions cache..."
        rm -rf ~/.cache || true
        rm -rf /tmp/* || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and test Ingestion service
      run: |
        #!/bin/bash
        set -euo pipefail
        set -x

        COMPOSE_FILES="-f docker-compose.yml -f docker-compose.override.yml"

        # Ensure cleanup always runs and we preserve the original exit code
        function finish {
          rc=$?
          echo "===== CI STEP EXIT CODE: $rc ====="
          echo "Dumping CORE logs (last 200 lines):"
          docker compose $COMPOSE_FILES logs --tail=200 core || true
          echo "Dumping Ingestion logs (last 200 lines):"
          docker compose $COMPOSE_FILES logs --tail=200 ingestion || true
          echo "Service status:"
          docker compose $COMPOSE_FILES ps || true
          docker compose $COMPOSE_FILES down --remove-orphans || true
          docker system prune -f || true
          exit $rc
        }
        trap finish EXIT

        # Fresh start
        echo "===== [1/5] Cleaning up stale containers, images, volumes ====="
        docker compose $COMPOSE_FILES down --remove-orphans || true
        docker system prune -af || true
        docker builder prune -af || true
        docker volume prune -f || true
        echo "===== [1/5] Cleanup done ====="

        # Build ingestion image
        echo "===== [2/5] Building ingestion image (no-cache) ====="
        docker compose $COMPOSE_FILES build --no-cache ingestion
        echo "===== [2/5] Ingestion image built successfully ====="

        # Start required dependencies (detached)
        echo "===== [3/5] Starting dependencies: mongodb neo4j postgres core ====="
        docker compose $COMPOSE_FILES up -d mongodb neo4j postgres core
        echo "===== [3/5] Dependencies started (detached) ====="

        # Helper to check container health using docker inspect
        function wait_for_services {
          services=(mongodb neo4j postgres core)
          timeout=${1:-300}
          echo "--- wait_for_services: checking ${services[*]} (timeout=${timeout}s) ---"
          until [ $timeout -le 0 ]; do
            all_ok=true
            for svc in "${services[@]}"; do
              cid=$(docker compose $COMPOSE_FILES ps -q "$svc" || true)
              if [ -z "$cid" ]; then
                echo "Service $svc has no container id yet"
                all_ok=false
                break
              fi
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid" 2>/dev/null || echo "unknown")
              echo "Service $svc status: $status"
              if [[ "$status" != "healthy" && "$status" != "running" ]]; then
                all_ok=false
                break
              fi
            done

            if [ "$all_ok" = true ]; then
              echo "All services are healthy/running"
              return 0
            fi

            docker compose $COMPOSE_FILES ps
            sleep 5
            timeout=$((timeout - 5))
          done
          echo "--- wait_for_services: timed out ---"
          echo "--- Final service state at timeout ---"
          docker compose $COMPOSE_FILES ps
          echo "--- mongodb logs ---"
          docker compose $COMPOSE_FILES logs --tail=50 mongodb || true
          echo "--- neo4j logs ---"
          docker compose $COMPOSE_FILES logs --tail=50 neo4j || true
          echo "--- postgres logs ---"
          docker compose $COMPOSE_FILES logs --tail=50 postgres || true
          echo "--- core logs ---"
          docker compose $COMPOSE_FILES logs --tail=100 core || true
          return 1
        }

        echo "===== [4/5] Waiting for all services to be healthy ====="
        if ! wait_for_services 300; then
          echo "Timeout waiting for dependencies to be healthy"
          docker compose $COMPOSE_FILES logs mongodb neo4j postgres core || true
          exit 1
        fi
        echo "===== [4/5] All services healthy ====="

        # Run ingestion with exit-code propagation — no fragile log-grepping
        echo "===== [5/5] Running ingestion tests (abort-on-container-exit) ====="
        echo "--- docker compose ps before test run ---"
        docker compose $COMPOSE_FILES ps
        docker compose $COMPOSE_FILES up --abort-on-container-exit --exit-code-from ingestion ingestion
        echo "===== [5/5] Ingestion finished successfully ====="
